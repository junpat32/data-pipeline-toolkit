[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "data-pipeline-toolkit"
version = "0.1.0"
description = "Local delivery validation and reporting with DuckDB"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.4.4",
    "filelock==3.20.3",
    "pyarrow==22.0.0",
    "streamlit==1.52.2",
    "pandas==2.3.3",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
dpt = "dpt.cli:main"

[tool.setuptools]
packages = ["dpt", "dpt.sql"]
package-dir = { "" = "src", "dpt.sql" = "sql" }

[tool.setuptools.package-data]
"dpt.sql" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
